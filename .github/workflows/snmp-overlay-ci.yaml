name: SNMP discovery overlay CI

on:
  push:
    branches: [codex/snmp-external-mapping-v2.17.0]
  pull_request:
    paths:
      - ".github/workflows/snmp-overlay-ci.yaml"
      - ".dockerignore"
      - "agent/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "orb-discovery/snmp-discovery/**"
      - "deploy/snmp-discovery/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snmp-overlay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            orb-discovery/snmp-discovery/go.sum
      - name: Test Agent argument forwarding
        run: go test -race ./agent/backend/snmpdiscovery
      - name: Test SNMP discovery and OID mapping
        working-directory: orb-discovery/snmp-discovery
        run: go test -race ./...

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: deploy/snmp-discovery
        shell: bash
    env:
      COMPOSE_FILE: compose.yaml:compose.verify.yaml
      ORB_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Check the pinned base and verification config
        run: |
          base=$(jq -er '.base_image.ref' image.lock.json)
          [[ "$base" =~ @sha256:[0-9a-f]{64}$ ]]
          docker compose config --format json | jq -e --arg base "$base" '
            .services["orb-agent"] |
            .build.args.ORB_BASE_IMAGE == $base and
            .build.dockerfile == "agent/docker/Dockerfile.snmp-overlay" and
            .command == ["run", "-c", "/etc/orb/agent.verify.yaml"]'
      - name: Build and start the overlay
        run: |
          docker compose build --pull orb-agent
          docker compose up -d --no-build --pull never orb-agent
      - name: Verify external mapping and backend readiness
        run: |
          for ((attempt=1; attempt<=60; attempt++)); do
            if docker compose exec -T orb-agent wget -qO- http://127.0.0.1:8070/api/v1/status |
               jq -e '.version == "1.39.0-external-mapping" and has("policies") and (.policies | length == 0)' >/dev/null &&
               docker compose logs --no-color orb-agent | grep -F 'loaded external OID mapping' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::SNMP discovery did not load the external mapping and become ready"
          exit 1
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop verification services
        if: always()
        run: docker compose down --remove-orphans
