name: SNMP discovery overlay CI

on:
  push:
    branches: [codex/snmp-external-mapping-v2.17.0]
  pull_request:
    paths:
      - ".github/workflows/snmp-overlay-ci.yaml"
      - ".github/workflows/_snmp-overlay-container.yaml"
      - ".dockerignore"
      - "agent/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "orb-discovery/snmp-discovery/**"
      - "deploy/snmp-discovery/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snmp-overlay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            orb-discovery/snmp-discovery/go.sum
      - name: Test Agent argument forwarding
        run: go test -race ./agent/backend/snmpdiscovery
      - name: Test SNMP discovery and OID mapping
        working-directory: orb-discovery/snmp-discovery
        run: go test -race ./...

  container:
    if: github.event_name != 'push'
    uses: ./.github/workflows/_snmp-overlay-container.yaml

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/snmp-external-mapping-v2.17.0'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_snmp-overlay-container.yaml
    with:
      publish: true
